name: voa-content-library
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${CONTENT_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CONTENT_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - object-data:/data

  init-state:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - crawler-state:/data
    restart: "no"

  crawler:
    build: .
    restart: "no"
    env_file: .env
    volumes:
      - crawler-state:/data
    depends_on:
      minio:
        condition: service_started
      init-state:
        condition: service_completed_successfully

  aligner:
    build:
      context: .
      dockerfile: Dockerfile.aligner
    restart: "no"
    env_file: .env
    environment:
      ALIGN_MODEL: ${ALIGN_MODEL:-base.en}
      ALIGN_DEVICE: ${ALIGN_DEVICE:-cpu}
      ALIGN_COMPUTE_TYPE: ${ALIGN_COMPUTE_TYPE:-int8}
      ALIGNMENT_VERSION: ${ALIGNMENT_VERSION:-v2}
    volumes:
      - aligner-models:/models
    depends_on:
      minio:
        condition: service_started

  crawler-worker:
    image: voa-content-library-crawler
    restart: on-failure
    command: ["-source", "voa", "-limit", "0"]
    env_file: .env
    volumes:
      - crawler-state:/data
    depends_on:
      minio:
        condition: service_started
      init-state:
        condition: service_completed_successfully

  aligner-worker:
    image: voa-content-library-aligner
    restart: unless-stopped
    command: ["--watch", "--limit", "25", "--poll-seconds", "60"]
    env_file: .env
    environment:
      ALIGN_MODEL: ${ALIGN_MODEL:-base.en}
      ALIGN_DEVICE: ${ALIGN_DEVICE:-cpu}
      ALIGN_COMPUTE_TYPE: ${ALIGN_COMPUTE_TYPE:-int8}
      ALIGNMENT_VERSION: ${ALIGNMENT_VERSION:-v2}
    volumes:
      - aligner-models:/models
    depends_on:
      minio:
        condition: service_started

volumes:
  object-data:
  crawler-state:
  aligner-models:
