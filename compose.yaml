name: voa-content-library
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${CONTENT_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${CONTENT_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - object-data:/data

  init-state:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - crawler-state:/data
    restart: "no"

  crawler:
    build: .
    restart: "no"
    env_file: .env
    volumes:
      - crawler-state:/data
    depends_on:
      minio:
        condition: service_started
      init-state:
        condition: service_completed_successfully

volumes:
  object-data:
  crawler-state:
